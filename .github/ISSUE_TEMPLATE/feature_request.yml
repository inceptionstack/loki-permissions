name: Feature request
description: Propose a new deny, a new threat-model scenario, or a usability improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or threat does this address?
      placeholder: "PowerUserAccess permits XYZ which can be used to..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Specific Sids/actions/conditions you'd add or change. Include both JSON and Terraform sides.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: What does this break or constrain? Day-2 ops impact?
    validations:
      required: false
  - type: checkboxes
    id: scope-check
    attributes:
      label: Threat-model fit
      description: This repo is opinionated about a specific deployment shape (autonomous agent on private subnet, message-driven control). Does this proposal fit that?
      options:
        - label: This proposal fits the repo's documented threat model
          required: true
